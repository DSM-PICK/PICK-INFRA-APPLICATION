{{- range .Values.deployments }}
{{- $name := default (include "app.name" $) .name | trunc 63 | trimSuffix "-" }}
{{- $service := default (dict) .service }}
{{- $port := default 80 $service.port }}
{{- $ingress := default (dict) .ingress }}
{{- $hosts := default (list) $ingress.hosts }}
{{- if $ingress.host }}
{{- $hosts = append $hosts $ingress.host }}
{{- end }}
{{- if $hosts }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    app: {{ $name }}

spec:
  entryPoints:
    {{- toYaml (default (list "web") $ingress.entryPoints) | nindent 4 }}

  routes:
    {{- range $host := $hosts }}
    - kind: Rule
      match: Host(`{{ $host }}`)

      services:
        - name: {{ $name }}
          port: {{ $port }}
    {{- end }}
{{- end }}
{{- end }}
