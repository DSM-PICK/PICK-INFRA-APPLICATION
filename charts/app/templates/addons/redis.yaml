{{- range .Values.addons }}
{{- if eq .type "redis" }}
{{- $name := include "addon.name" . }}
{{- $image := default (dict) .image }}
---
apiVersion: v1
kind: Service

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: service

spec:
  type: ClusterIP

  selector:
    {{- include "addon.selectorLabels" . | nindent 4 }}

  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ $name }}-data
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  accessModes:
    - ReadWriteOnce
  {{- with (include "addon.storageClassName" .) }}
  storageClassName: {{ . }}
  {{- end }}

  resources:
    requests:
      storage: {{ include "addon.storageSize" . }}
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: cache

spec:
  replicas: 1

  selector:
    matchLabels:
      {{- include "addon.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "addon.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: redis

          image: "{{ default "redis" $image.repository }}:{{ default "7-alpine" $image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}

          ports:
            - containerPort: 6379

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
{{- end }}
{{- end }}
