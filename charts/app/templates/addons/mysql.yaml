{{- range .Values.addons }}
{{- if eq .type "mysql" }}
{{- $name := include "addon.name" . }}
{{- $image := default (dict) .image }}
{{- $secretName := default (printf "%s-secret" $name) .secretName }}
---
apiVersion: v1
kind: Service

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: service

spec:
  type: ClusterIP

  selector:
    {{- include "addon.selectorLabels" . | nindent 4 }}

  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ $name }}-data
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  accessModes:
    - ReadWriteOnce
  {{- if and (kindIs "map" .storage) .storage.storageClassName }}
  storageClassName: {{ .storage.storageClassName }}
  {{- end }}

  resources:
    requests:
      storage: {{ include "addon.storageSize" . }}
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: database

spec:
  replicas: 1

  selector:
    matchLabels:
      {{- include "addon.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "addon.selectorLabels" . | nindent 8 }}

    spec:
      containers:
        - name: mysql

          image: "{{ default "mysql" $image.repository }}:{{ default "8.4" $image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}

          ports:
            - containerPort: 3306

          env:
            - name: MYSQL_DATABASE
              value: {{ default "app" .database | quote }}

            - name: MYSQL_USER
              value: {{ default "app" .username | quote }}

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: mysql-password

            - name: MYSQL_ALLOW_EMPTY_PASSWORD
              value: "yes"

            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: mysql-root-password

          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- else }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          {{- end }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
{{- end }}
{{- end }}
