{{- range .Values.addons }}
{{- if eq .type "prometheus" }}
{{- $name := include "addon.name" . }}
{{- $image := default (dict) .image }}
{{- $service := default (dict) .service }}
{{- $port := default 9090 $service.port }}
{{- $rbacName := printf "%s-%s" (include "project.namespace" $) $name | trunc 63 | trimSuffix "-" }}
{{- $pv := default (dict) .pv }}
{{- $pvName := printf "%s-%s-pv" (include "project.namespace" $) $name | trunc 63 | trimSuffix "-" }}
{{- if $pv.hostPath }}
---
apiVersion: v1
kind: PersistentVolume

metadata:
  name: {{ $pvName }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  capacity:
    storage: {{ include "addon.storageSize" . }}

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ default "manual" $pv.storageClassName }}

  hostPath:
    path: {{ $pv.hostPath }}
    type: DirectoryOrCreate
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ $name }}-data
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  accessModes:
    - ReadWriteOnce
  {{- if $pv.hostPath }}
  storageClassName: {{ default "manual" $pv.storageClassName }}
  volumeName: {{ $pvName }}
  {{- else if and (kindIs "map" .storage) .storage.storageClassName }}
  storageClassName: {{ .storage.storageClassName }}
  {{- end }}

  resources:
    requests:
      storage: {{ include "addon.storageSize" . }}
---
apiVersion: v1
kind: ServiceAccount

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole

metadata:
  name: {{ $rbacName }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics

rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - nodes/metrics
      - nodes/proxy
      - services
      - endpoints
      - pods
      - namespaces
      - configmaps
    verbs:
      - get
      - list
      - watch

  - nonResourceURLs:
      - /metrics
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding

metadata:
  name: {{ $rbacName }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics

roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $rbacName }}

subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ include "project.namespace" $ }}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ $name }}-config
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: config

data:
  prometheus.yml: |
{{ include "app.prometheus.config" . | indent 4 }}
---
apiVersion: v1
kind: Service

metadata:
  name: {{ include "addon.serviceName" . }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: service

spec:
  type: ClusterIP

  selector:
    {{- include "addon.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ $port }}
      targetPort: 9090
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      {{- include "addon.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "addon.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include "app.prometheus.config" . | sha256sum }}

    spec:
      serviceAccountName: {{ $name }}

      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534

      {{- if $pv.hostPath }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 65534:65534 /prometheus
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /prometheus
      {{- end }}

      containers:
        - name: prometheus

          image: "{{ default "prom/prometheus" $image.repository }}:{{ default "v3.16.0" $image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}

          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
            - --storage.tsdb.retention.time={{ default "15d" .retention }}
            - --web.enable-lifecycle

          ports:
            - containerPort: 9090
              name: http

          volumeMounts:
            - name: config
              mountPath: /etc/prometheus

            - name: data
              mountPath: /prometheus

          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 30
            periodSeconds: 20

          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- else }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          {{- end }}

      volumes:
        - name: config
          configMap:
            name: {{ $name }}-config

        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
{{- end }}
{{- end }}
