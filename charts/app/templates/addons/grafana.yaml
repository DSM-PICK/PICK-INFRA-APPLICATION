{{- range .Values.addons }}
{{- if eq .type "grafana" }}
{{- $name := include "addon.name" . }}
{{- $serviceName := include "addon.serviceName" . }}
{{- $image := default (dict) .image }}
{{- $service := default (dict) .service }}
{{- $port := default 3000 $service.port }}
{{- $secretName := default (printf "%s-admin" $name) .secretName }}
{{- $lokiURL := default "http://loki:3100" .lokiURL }}
{{- $prometheusURL := default "http://prometheus:9090" .prometheusURL }}
{{- $pv := default (dict) .pv }}
{{- $pvName := printf "%s-%s-pv" (include "project.namespace" $) $name | trunc 63 | trimSuffix "-" }}
{{- if $pv.hostPath }}
---
apiVersion: v1
kind: PersistentVolume

metadata:
  name: {{ $pvName }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  capacity:
    storage: {{ include "addon.storageSize" . }}

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ default "manual" $pv.storageClassName }}

  hostPath:
    path: {{ $pv.hostPath }}
    type: DirectoryOrCreate
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ $name }}-data
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  accessModes:
    - ReadWriteOnce
  {{- if $pv.hostPath }}
  storageClassName: {{ default "manual" $pv.storageClassName }}
  volumeName: {{ $pvName }}
  {{- else if and (kindIs "map" .storage) .storage.storageClassName }}
  storageClassName: {{ .storage.storageClassName }}
  {{- end }}

  resources:
    requests:
      storage: {{ include "addon.storageSize" . }}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ $name }}-datasources
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: config

data:
  prometheus.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: {{ $prometheusURL | quote }}
        isDefault: true
        editable: false

  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: {{ $lokiURL | quote }}
        isDefault: false
        editable: false
---
apiVersion: v1
kind: Service

metadata:
  name: {{ $serviceName }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: service

spec:
  type: ClusterIP

  selector:
    {{- include "addon.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ $port }}
      targetPort: 3000
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      {{- include "addon.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "addon.selectorLabels" . | nindent 8 }}

    spec:
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472

      {{- if $pv.hostPath }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 472:472 /var/lib/grafana
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana
      {{- end }}

      containers:
        - name: grafana

          image: "{{ default "grafana/grafana" $image.repository }}:{{ default "12.3.1" $image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}

          ports:
            - containerPort: 3000
              name: http

          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: admin-user

            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: admin-password

            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"

            {{- with .rootURL }}
            - name: GF_SERVER_ROOT_URL
              value: {{ . | quote }}
            {{- end }}

          volumeMounts:
            - name: data
              mountPath: /var/lib/grafana

            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources

          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20

          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- else }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 384Mi
          {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data

        - name: datasources
          configMap:
            name: {{ $name }}-datasources
{{- $ingress := default (dict) .ingress }}
{{- $hosts := default (list) $ingress.hosts }}
{{- if $ingress.host }}
{{- $hosts = append $hosts $ingress.host }}
{{- end }}
{{- if $hosts }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}

spec:
  entryPoints:
    {{- toYaml (default (list "web") $ingress.entryPoints) | nindent 4 }}

  routes:
    {{- range $host := $hosts }}
    - kind: Rule
      match: Host(`{{ $host }}`)

      services:
        - name: {{ $serviceName }}
          port: {{ $port }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
