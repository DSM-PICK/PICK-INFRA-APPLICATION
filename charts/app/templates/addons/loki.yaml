{{- range .Values.addons }}
{{- if eq .type "loki" }}
{{- $name := include "addon.name" . }}
{{- $image := default (dict) .image }}
{{- $service := default (dict) .service }}
{{- $port := default 3100 $service.port }}
{{- $pv := default (dict) .pv }}
{{- $pvName := printf "%s-%s-pv" (include "project.namespace" $) $name | trunc 63 | trimSuffix "-" }}
{{- if $pv.hostPath }}
---
apiVersion: v1
kind: PersistentVolume

metadata:
  name: {{ $pvName }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  capacity:
    storage: {{ include "addon.storageSize" . }}

  accessModes:
    - ReadWriteOnce

  persistentVolumeReclaimPolicy: Retain
  storageClassName: {{ default "manual" $pv.storageClassName }}

  hostPath:
    path: {{ $pv.hostPath }}
    type: DirectoryOrCreate
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: {{ $name }}-data
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage

spec:
  accessModes:
    - ReadWriteOnce
  {{- if $pv.hostPath }}
  storageClassName: {{ default "manual" $pv.storageClassName }}
  volumeName: {{ $pvName }}
  {{- else if and (kindIs "map" .storage) .storage.storageClassName }}
  storageClassName: {{ .storage.storageClassName }}
  {{- end }}

  resources:
    requests:
      storage: {{ include "addon.storageSize" . }}
---
apiVersion: v1
kind: ConfigMap

metadata:
  name: {{ $name }}-config
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: config

data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /var/loki
      instance_addr: 127.0.0.1
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
          rules_directory: /var/loki/rules

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/tsdb-index
        cache_location: /var/loki/tsdb-cache

    limits_config:
      retention_period: {{ default "744h" .retention }}

    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
apiVersion: v1
kind: Service

metadata:
  name: {{ include "addon.serviceName" . }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: service

spec:
  type: ClusterIP

  selector:
    {{- include "addon.selectorLabels" . | nindent 4 }}

  ports:
    - name: http
      port: {{ $port }}
      targetPort: 3100
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ $name }}
  namespace: {{ include "project.namespace" $ }}

  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: logs

spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      {{- include "addon.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "addon.selectorLabels" . | nindent 8 }}

    spec:
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001

      {{- if $pv.hostPath }}
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command:
            - sh
            - -c
            - chown -R 10001:10001 /var/loki
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/loki
      {{- end }}

      containers:
        - name: loki

          image: "{{ default "grafana/loki" $image.repository }}:{{ default "3.6.16" $image.tag }}"
          imagePullPolicy: {{ default "IfNotPresent" $image.pullPolicy }}

          args:
            - -config.file=/etc/loki/loki.yaml

          ports:
            - containerPort: 3100
              name: http

          volumeMounts:
            - name: data
              mountPath: /var/loki

            - name: config
              mountPath: /etc/loki

          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 30
            periodSeconds: 20

          {{- if .resources }}
          resources:
            {{- toYaml .resources | nindent 12 }}
          {{- else }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 512Mi
          {{- end }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data

        - name: config
          configMap:
            name: {{ $name }}-config
{{- end }}
{{- end }}
