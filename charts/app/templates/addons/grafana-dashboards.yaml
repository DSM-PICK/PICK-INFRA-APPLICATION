{{- range .Values.addons }}
{{- if eq .type "grafana" }}
{{- $name := include "addon.name" . }}
{{- $namespace := include "project.namespace" $ }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboard-provisioning
  namespace: {{ $namespace }}
  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-config
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Kubernetes
        orgId: 1
        folder: Kubernetes
        folderUid: kubernetes
        type: file
        disableDeletion: true
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-dashboards
  namespace: {{ $namespace }}
  labels:
    {{- include "addon.labels" . | nindent 4 }}
    app.kubernetes.io/component: dashboard-config
data:
  kubernetes-pods-logs.json: |-
    {
      "annotations": {"list": []},
      "editable": false,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 4, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"colorMode": "value", "graphMode": "area", "justifyMode": "auto", "orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"], "fields": "", "values": false}, "textMode": "auto"},
          "targets": [{"expr": "count(count by (namespace, pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"POD\",container!=\"\"}))", "refId": "A"}],
          "title": "Pods",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {"unit": "cores"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"POD\",container!=\"\"}[5m]))", "legendFormat": "{{ "{{pod}}" }}", "refId": "A"}],
          "title": "CPU Usage by Pod",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "id": 3,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (pod) (container_memory_working_set_bytes{namespace=~\"$namespace\",pod=~\"$pod\",container!=\"POD\",container!=\"\"})", "legendFormat": "{{ "{{pod}}" }}", "refId": "A"}],
          "title": "Memory Usage by Pod",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "gridPos": {"h": 12, "w": 24, "x": 0, "y": 12},
          "id": 4,
          "options": {"deduplication": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": false, "showLabels": true, "showTime": true, "sortOrder": "Descending", "wrapLines": false},
          "targets": [{"expr": "{namespace=~\"$namespace\",pod=~\"$pod\"}", "queryType": "range", "refId": "A"}],
          "title": "Pod Logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "templating": {"list": [
        {"current": {"text": "All", "value": ["$__all"]}, "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "definition": "label_values(container_memory_working_set_bytes, namespace)", "includeAll": true, "multi": true, "name": "namespace", "query": "label_values(container_memory_working_set_bytes, namespace)", "refresh": 1, "type": "query"},
        {"current": {"text": "All", "value": ["$__all"]}, "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"}, "definition": "label_values(container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"POD\",container!=\"\"}, pod)", "includeAll": true, "multi": true, "name": "pod", "query": "label_values(container_memory_working_set_bytes{namespace=~\"$namespace\",container!=\"POD\",container!=\"\"}, pod)", "refresh": 1, "type": "query"}
      ]},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "Kubernetes Pods & Logs",
      "uid": "kubernetes-pods-logs",
      "version": 1
    }
  pick-prod-monitoring.json: |-
    {
      "annotations": {"list": []},
      "description": "PiCK PROD CORE HTTP 지표 모니터링",
      "editable": true,
      "graphTooltip": 0,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"cellHeight": "sm", "showHeader": true},
          "targets": [
            {"editorMode": "code", "expr": "sort_desc(round(sum by (uri) (increase(http_server_requests_seconds_count{namespace=\"pick-prod\",app=\"pick-core-prod\",uri!~\"/actuator/.*\"}[$__range]))))", "format": "table", "instant": true, "range": false, "refId": "A"},
            {"editorMode": "code", "expr": "round(sum by (uri) (increase(http_server_requests_seconds_count{namespace=\"pick-prod\",app=\"pick-core-prod\",status=~\"5..\",uri!~\"/actuator/.*\"}[$__range])))", "format": "table", "instant": true, "range": false, "refId": "B"},
            {"editorMode": "code", "expr": "histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{namespace=\"pick-prod\",app=\"pick-core-prod\",uri!~\"/actuator/.*\"}[5m])))", "format": "table", "instant": true, "range": false, "refId": "C"}
          ],
          "transformations": [
            {"id": "joinByField", "options": {"byField": "uri", "mode": "outer"}},
            {"id": "organize", "options": {"excludeByName": {"Time 1": true, "Time 2": true, "Time 3": true}, "renameByName": {"Value #A": "호출 수", "Value #B": "5xx", "Value #C": "p95(초)"}}}
          ],
          "title": "엔드포인트 기준선",
          "type": "table"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 2,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{namespace=\"pick-prod\",app=\"pick-core-prod\",uri!~\"/actuator/.*\"}[5m])))", "legendFormat": "{{ "{{uri}}" }}", "refId": "A"}],
          "title": "엔드포인트별 p95 응답시간",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 3,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "round(sum by (uri) (increase(http_server_requests_seconds_count{namespace=\"pick-prod\",app=\"pick-core-prod\",status=~\"5..\",uri!~\"/actuator/.*\"}[1h])))", "legendFormat": "{{ "{{uri}}" }}", "refId": "A"}],
          "title": "5xx 에러 수",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16},
          "id": 4,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "round(sum by (uri) (increase(http_server_requests_seconds_count{namespace=\"pick-prod\",app=\"pick-core-prod\",uri!~\"/actuator/.*\"}[24h])))", "legendFormat": "{{ "{{uri}}" }}", "refId": "A"}],
          "title": "엔드포인트별 하루 총 호출 수",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "PBFA97CFB590B2093"},
          "fieldConfig": {"defaults": {"unit": "reqps"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16},
          "id": 5,
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [{"expr": "sum by (uri) (rate(http_server_requests_seconds_count{namespace=\"pick-prod\",app=\"pick-core-prod\",uri!~\"/actuator/.*\"}[5m]))", "legendFormat": "{{ "{{uri}}" }}", "refId": "A"}],
          "title": "엔드포인트별 호출량",
          "type": "timeseries"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": ["pick", "prod", "core"],
      "time": {"from": "now-7d", "to": "now"},
      "timezone": "browser",
      "title": "pick-prod-monitoring",
      "uid": "pick-prod-monitoring",
      "version": 1
    }
  workload-logs.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "loki", "uid": "P8E80F9AEF21F6940"},
          "description": "Pod 이름이 바뀌어도 namespace와 workload component 기준으로 계속 조회합니다.",
          "gridPos": {"h": 20, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "options": {"deduplication": "none", "enableLogDetails": true, "prettifyLogMessage": false, "showCommonLabels": true, "showLabels": true, "showTime": true, "sortOrder": "Descending", "wrapLines": false},
          "targets": [{"expr": "{namespace=\"$namespace\",component=~\"$component\"}", "queryType": "range", "refId": "A"}],
          "title": "${namespace} / ${component} 전체 로그",
          "type": "logs"
        }
      ],
      "refresh": "10s",
      "schemaVersion": 42,
      "tags": ["pick", "logs", "prod", "stag"],
      "templating": {"list": [
        {"current": {"text": "pick-prod", "value": "pick-prod"}, "includeAll": false, "label": "환경", "name": "namespace", "options": [{"selected": true, "text": "pick-prod", "value": "pick-prod"}, {"selected": false, "text": "pick-stag", "value": "pick-stag"}], "query": "pick-prod,pick-stag", "type": "custom"},
        {"allValue": ".*", "current": {"text": "All", "value": ["$__all"]}, "includeAll": true, "label": "컴포넌트", "multi": true, "name": "component", "options": [], "query": "core,admin,kafka,redis", "type": "custom"}
      ]},
      "time": {"from": "now-1h", "to": "now"},
      "timezone": "browser",
      "title": "PROD / STAG Workload Logs",
      "uid": "workload-logs",
      "version": 1
    }
{{- end }}
{{- end }}
