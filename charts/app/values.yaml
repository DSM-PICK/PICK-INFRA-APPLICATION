# Namespace
# 비워두면 ArgoCD destination namespace(.Release.Namespace)를 사용
namespace: ""

# 모든 Deployment에 적용할 imagePullSecrets (deployment별로 덮어쓸 수 있음)
imagePullSecrets: []
#  - name: registry-pull-secret


# Deployments
deployments:
  - name: admin
    replicas: 1

    image:
      repository: nginx
      tag: latest
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 80
      targetPort: 8080

    # hosts가 비어 있으면 IngressRoute를 생성하지 않음
    ingress:
      entryPoints:
        - web
      hosts: []
      # - admin.example.com

    # name이 비어 있으면 secretRef를 주입하지 않음
    secret:
      name: ""

  - name: user
    replicas: 1

    image:
      repository: nginx
      tag: latest
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 80
      targetPort: 8080

    ingress:
      entryPoints:
        - web
      hosts: []
      # - user.example.com

    secret:
      name: ""


