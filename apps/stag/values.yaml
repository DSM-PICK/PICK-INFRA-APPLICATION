namespace: pick-stag
deployments:
  - name: pick-core-stag
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    image:
      repository: sungjujjang/pick-core-stag
      tag: c6a9d14f1ca168791d23e7f72fcfc1a8d33cb488
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    metrics:
      enabled: true
    ingress:
      entryPoints:
        - web
      hosts:
        - pick-core-stag.dsmhs.kr
    secret:
      name: pick-pick-core-stag
  - name: pick-admin-stag
    replicas: 1
    image:
      repository: sungjujjang/pick-admin-stag
      tag: 8edbfd5e8aaec77ae3496b416d8963dc37598a08
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    metrics:
      nginx: true
    ingress:
      entryPoints:
        - web
      hosts:
        - pick-admin-stag.dsmhs.kr
    secret:
      name: ""
  - name: pick-teacher-stag
    replicas: 1
    image:
      repository: sungjujjang/pick-teacher-stag
      tag: 691f22cbe10f05f96aff654496cda6d9b8784c15
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    metrics:
      nginx: true
    ingress:
      entryPoints:
        - web
      hosts:
        - pick-teacher-stag.dsmhs.kr
    secret:
      name: ""
addons:
  - type: redis
    name: pick-redis-stag
    storage: 1Gi
  - type: mysql
    name: pick-pick-core-stag-mysql
    database: pick_pick_core_stag_mysql
    secretName: pick-pick-core-stag-mysql-secret
    storage: 1Gi
  - type: kafka
    name: pick-kafka-stag
    storage:
      size: 2Gi
      storageClassName: local-path
  - type: debezium
    name: pick-debezium-stag
    storage: 5Gi
    bootstrap: pick-kafka-stag:9092
