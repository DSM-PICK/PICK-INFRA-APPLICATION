namespace: example

deployments:
  - name: web
    replicas: 1

    image:
      repository: registry-pick.dsmhs.kr/test/nginx
      tag: latest
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 80
      targetPort: 80

    ingress:
      entryPoints:
        - web
      hosts:
        - example-pick.dsmhs.kr

    secret:
      name: ""
