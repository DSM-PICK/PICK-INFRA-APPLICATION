namespace: pick-prod
deployments:
  - name: pick-core-prod
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 6Gi
    image:
      repository: sungjujjang/pick-core-prod
      tag: edf126d75671bc4e94051ffac0831e17ae8b559c
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    metrics:
      enabled: true
    ingress:
      entryPoints:
        - web
      hosts:
        - pick-core.dsmhs.kr
    secret:
      name: pick-pick-core-prod
  - name: pick-admin-prod
    replicas: 1
    image:
      repository: sungjujjang/pick-admin-prod
      tag: 8fd3d90608d4f7d48b67541fe8a83655f3b3b4e5
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    metrics:
      nginx: true
    ingress:
      entryPoints:
        - web
      hosts:
        - pick-admin.dsmhs.kr
    secret:
      name: ""
  - name: pick-teacher-prod
    replicas: 1
    image:
      repository: sungjujjang/pick-teacher-prod
      tag: 8d9c4d5f52c226b30393d5a49d25783d676487fb
      pullPolicy: Always
    service:
      type: ClusterIP
      port: 80
      targetPort: 8080
    metrics:
      nginx: true
    ingress:
      entryPoints:
        - web
      hosts:
        - pick-teacher.dsmhs.kr
    secret:
      name: ""
addons:
  - type: redis
    name: pick-redis-prod
    storage: 1Gi
  - type: mysql
    name: pick-pick-core-prod-mysql
    database: pick_pick_core_prod_mysql
    secretName: pick-pick-core-prod-mysql-secret
    storage: 1Gi
  - type: kafka
    name: pick-kafka-prod
    storage:
      size: 2Gi
      storageClassName: local-path
  - type: debezium
    name: pick-debezium-prod
    storage:
      size: 5Gi
      storageClassName: local-path
    bootstrap: pick-kafka-prod:9092
